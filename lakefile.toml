name = "lawlib"
version = "0.1.0"
defaultTargets = ["Lawlib", "Tests"]
# `lake test` builds the Tests library: the fixtures, the claims about
# printed artifacts and executed PolicyEngine, and the theorems that
# check the law against them. The differential suite against a live
# PolicyEngine lives in the pe2lean repository (`pe2lean-diff`), since
# it needs Python.
testDriver = "Tests"

# Phase 2 (design §2): mathlib for order/algebra lemmas behind the
# ∀-theorems. Generated definitions still use only core types (ℚ = Rat).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "Lawlib"
# Pure law only (DESIGN.md §1): fixtures, claims, and the
# Asserted shadow live in the Tests lib below.
# `Lawlib` is the root module, which does not import
# Verify.CatalaSweep2023 — the 480,008-point exhaustive comparison.
# That module is a check, not a dependency; the nightly job builds it
# explicitly (see .github/workflows/ci.yml).
globs = ["Lawlib"]
# native_decide over the full-depth eitc closure needs a deep
# elaboration-thread stack (default 8MB segfaults).
moreLeanArgs = ["--tstack=262144"]

[[lean_lib]]
name = "Tests"
# Fixtures (the transcribed EIC table), claims about reality (the
# printed artifact, executed PolicyEngine), and their certified
# conditionals. Imports Lawlib; never the reverse. The Asserted shadow
# is imported by nothing (CI-enforced) but must still compile.
globs = ["Tests.+"]
moreLeanArgs = ["--tstack=262144"]

[[lean_exe]]
name = "lawlib"
root = "Main"
