name = "lawlib"
version = "0.1.0"
defaultTargets = ["Lawlib"]

# Phase 2 (design §2): mathlib for order/algebra lemmas behind the
# ∀-theorems. Generated definitions still use only core types (ℚ = Rat).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "Lawlib"
# The Asserted shadow is imported by nothing (CI-enforced) but must
# still compile: build it explicitly alongside the root module.
globs = ["Lawlib", "Lawlib.Claims.Asserted"]

[[lean_exe]]
name = "lawlib"
root = "Main"
