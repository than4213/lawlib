# CI per design §7: build must be `lake build`-only for consumers;
# extraction is re-run and diffed byte-for-byte (determinism + the
# never-hand-edit rule); differential suite: roots-tier deep soak plus a
# full-tier sweep, sized to the ~4s/household cost of full-width
# exact-rational comparison (see pe2lean harness/diff.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # nightly acceptance

env:
  # Bumping either pin is a deliberate PR (design §6.3).
  PE2LEAN_REF: v0.9.22
  PYTHON_VERSION: "3.12"

jobs:
  build-and-verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The heavy proofs (Catala2023 evaluates 60,001 points under
    # native_decide) make a cold build genuinely long; cache below keeps
    # the common case short, and this ceiling is above the cold case so a
    # slow run reports rather than being killed mid-step.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true    # prebuilt Mathlib, not a local rebuild
          use-github-cache: true     # keep .lake/build between runs
      - name: Build evaluator binary
        run: lake build lawlib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned extractor
        run: pip install "pe2lean @ git+https://github.com/than4213/pe2lean.git@${{ env.PE2LEAN_REF }}"
      - name: Axiom quarantine (nothing imports Tests.Asserted)
        run: |
          ! grep -rn "import Tests.Asserted" --include="*.lean" . \
            | grep -v "Tests/Asserted.lean"
      - name: Determinism check (re-extract must be byte-identical)
        run: |
          pe2lean extract --lawlib .
          git diff --exit-code
      - name: Parameter spot-check
        run: pe2lean-spot --lawlib .
      - name: Differential test (roots tier, 2000 households)
        run: pe2lean-diff 2000 --lawlib . --tier roots
      - name: Differential test (full tier, 500 households)
        run: pe2lean-diff 500 --lawlib .

  nightly-acceptance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build evaluator binary
        run: lake build lawlib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned extractor
        run: pip install "pe2lean @ git+https://github.com/than4213/pe2lean.git@${{ env.PE2LEAN_REF }}"
      - name: Exhaustive Catala comparison (480,008 points, ~25 min)
        run: lake build Lawlib.Verify.CatalaSweep2023
      - name: Differential acceptance (roots tier, 15k households, 2021-2025)
        run: pe2lean-diff 15000 --lawlib . --tier roots
      - name: Differential acceptance (full tier, 3k households)
        run: pe2lean-diff 3000 --lawlib . 7
